<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Auth | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="theme-switch" id="theme-toggle" style="position:fixed; top:20px; right:20px; cursor:pointer; font-size: 1.5rem;">
        <i class="fas fa-moon"></i>
    </div>

    <main class="auth-card" id="tilt-card">
        <div class="card-header" style="text-align:center;">
            <i class="fas fa-rocket" style="font-size: 2rem; color: var(--primary); margin-bottom:1rem;"></i>
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle" style="color:var(--text-dim); margin-bottom:1.5rem;">Sign in to continue</p>
        </div>

        <div id="error-message" style="color: var(--error); text-align: center; margin-bottom: 1rem; font-size: 0.9rem;"></div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="login-email" required placeholder="Email Address">
            </div>
            <div class="input-group">
                <input type="password" id="login-password" required placeholder="Password">
            </div>
            
            <button type="submit" class="btn-primary">Sign In</button>
            <div style="text-align:center; margin-top:15px;">
                <a href="#" id="forgot-password" style="color:var(--text-dim); text-decoration:none; font-size:0.85rem;">Forgot Password?</a>
            </div>
            
            <div class="divider">or</div>
            
            <button type="button" id="google-btn" class="btn-secondary">
                <i class="fab fa-google"></i> Continue with Google
            </button>
            
            <div style="text-align:center; margin-top:20px; font-size: 0.9rem;">
                <span style="color:var(--text-dim);">Don't have an account?</span> 
                <a href="#" id="show-register" style="color:var(--primary); font-weight: 600; text-decoration: none;">Sign Up</a>
            </div>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="register-form" class="hidden">
            <div class="input-group">
                <input type="text" id="reg-name" required placeholder="Full Name">
            </div>
            <div class="input-group">
                <input type="email" id="reg-email" required placeholder="Email Address">
            </div>
            <div class="input-group">
                <input type="password" id="reg-password" required placeholder="Create Password (min 6 chars)">
            </div>
            
            <button type="submit" class="btn-primary">Create Account</button>
            
            <div style="text-align:center; margin-top:20px; font-size: 0.9rem;">
                <span style="color:var(--text-dim);">Already have an account?</span> 
                <a href="#" id="show-login" style="color:var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
            </div>
        </form>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
