<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Auth | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="theme-switch" id="theme-toggle" title="Toggle Theme">
        <i class="fas fa-moon"></i>
    </div>

    <main class="auth-card">
        <div class="card-header">
            <div class="logo-circle">
                <i class="fas fa-rocket"></i>
            </div>
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle">Sign in to your account</p>
        </div>

        <div id="error-message"></div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="input-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@company.com">
            </div>
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            
            <div class="form-actions">
                <a href="#" id="forgot-password" class="text-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-primary">Sign In</button>
            
            <div class="divider"><span>or</span></div>
            
            <button type="button" id="google-btn" class="btn-secondary">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18">
                Continue with Google
            </button>
            
            <div class="footer-text">
                Don't have an account? <a href="#" id="show-register" class="text-link font-semibold">Sign Up</a>
            </div>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden" style="display: none;">
            <div class="input-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" required placeholder="John Doe">
            </div>
            <div class="input-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@company.com">
            </div>
            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required placeholder="Min. 6 characters">
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 1rem;">Create Account</button>
            
            <div class="footer-text">
                Already have an account? <a href="#" id="show-login" class="text-link font-semibold">Sign In</a>
            </div>
        </form>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
